[project]
name = "wcmodel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2", "pyarrow>=16", "duckdb>=1.1", "numpy>=2.0",
  "scipy>=1.13", "statsbombpy>=1.14", "httpx>=0.27", "pyyaml>=6.0",
  "pymc>=5.16", "arviz>=0.18",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
[project.scripts]
wc-dashboard-build = "wcmodel.dashboard.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/wcmodel"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (PyMC NUTS sampling); deselect with -m 'not slow'",
]
