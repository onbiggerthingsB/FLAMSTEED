name: CI

# The gap this closes, stated plainly: nothing ran the test suite or checked the
# preregistration lock automatically. On 2026-08-09 a branding commit put the
# lock chain into a refusing state and nobody found out for two days and three
# commits, because the chain is only consulted when someone runs a verdict.
# See the lock-v9 amendment in reports/oa_prereg.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds, zero dependencies: src/wcmodel/eval/lock.py is pure stdlib.
  # Kept separate from the test job on purpose — it must report fast and it
  # must not be able to fail for an unrelated reason.
  lock:
    name: Preregistration lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # require_lock diffs the code tree between the lock's code_commit and
          # HEAD. A shallow clone does not contain code_commit, so the check
          # would error rather than answer. Full history is required.
          fetch-depth: 0

      - name: Verify the chain AND that the attested code has not drifted
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from wcmodel.eval.lock import require_lock, LockError

          # NOT `scripts/oa_lock.py` on its own. That runs verify_chain, which
          # checks document hashes and the chain but NOT code drift — it prints
          # LOCK VALID and exits 0 on precisely the tree that was refusing for
          # two days. require_lock(enforce_commit=True) is the real gate.
          try:
              head = require_lock()
          except LockError as e:
              print(f"::error::LOCK REFUSED — {e}")
              sys.exit(1)
          print(f"LOCK VALID  v{head['version']}  "
                f"code_commit {head['code_commit'][:12]}")
          PY

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 90   # local full suite ~36 min; GitHub runners + cold pip need headroom.
                          # 45 min was a self-inflicted wound: three runs died at exactly 45:00
                          # reported as 'cancelled', which reads as flakiness and is not.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # data/ is gitignored (5.9GB of paid odds captures and posterior caches),
      # so three test modules cannot run here. They are named, with the exact
      # artifact each one needs, rather than being quietly dropped: a suite that
      # silently covers less than it appears to is the failure mode this
      # project treats as a bug.
      #
      # This list is deliberately fail-closed. Any NEW test that reaches for
      # data/ is not in it, so CI goes red until someone decides on purpose
      # whether it belongs here.
      - name: Run the suite (data-dependent modules named and excluded)
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          echo "Excluded — require gitignored artifacts under data/:"
          echo "  tests/analysis/test_oa_devslate.py  -> data/oa_dev_ledger.parquet"
          echo "  tests/eval/test_verdict.py          -> data/stores/full_final/results.parquet"
          echo "  tests/eval/test_eval_manifest.py    -> data/clv_odds_cache.json"
          echo "Everything else, including all six leakage canaries, runs."
          echo
          pytest -q \
            --ignore=tests/analysis/test_oa_devslate.py \
            --ignore=tests/eval/test_verdict.py \
            --ignore=tests/eval/test_eval_manifest.py

      # The leakage canaries are the project's load-bearing invariant. They run
      # in the sweep above, but a green suite is easy to skim past, so state the
      # count explicitly. A canary that silently stopped collecting would look
      # exactly like a canary that passed.
      - name: Leakage canaries — report the count, do not just pass
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          n=$(pytest tests -k leakage --co -q 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "leakage tests collected: ${n}"
          if [ "${n}" -lt 40 ]; then
            echo "::error::only ${n} leakage tests collected (expected 40+) — canaries may have stopped running"
            exit 1
          fi
          pytest tests -k leakage -q

  # The EPL table simulator's suite — 935 tests that nothing automated ran.
  # `[tool.pytest.ini_options] testpaths = ["tests"]` means the job above never
  # collects epl/tests at all, so every EPL commit since the probe landed has
  # been merged on a green tick that said nothing about it. Same gap, same
  # reason, as the lock job at the top of this file: a check nobody runs is a
  # check nobody has.
  #
  # Separate job rather than a wider testpaths, because the two suites fail for
  # unrelated reasons and a reader should be able to see which one went red
  # without opening the log.
  #
  # PYTHONPATH=src:. — `src` for wcmodel (epl.recalfit reads A8's corpus pins
  # from it) and `.` for the epl package itself, which is not installed.
  epl:
    name: EPL suite
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 26s locally for the dataless subset (579 passed /
                          # 44 skipped); the budget is pip + a slower runner.
                          # 45 leaves the same kind of headroom the tests job
                          # learned to leave.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # Like the tests job above, the data-dependent modules are NAMED and
      # excluded rather than quietly dropped: CI has no data/ directory, and
      # eight EPL test files read data/epl/matches.parquet (or the fit stores)
      # at module scope, so here they would collect as errors, not skips. The
      # first version of this job claimed the suite was dataless-safe wholesale
      # — measured in a sandbox whose package root still saw the archive
      # (epl/paths.py anchors data/ at the package, guards resolve from cwd),
      # so the audit split the roots and counted a fantasy. Re-measured
      # single-rooted, dataless, at this commit: 579 passed / 44 skipped / 0
      # failures with these exclusions (578+1: one envelope test needs the git
      # metadata a real checkout always has).
      #
      # This list is deliberately fail-closed, exactly as above: a NEW test
      # that reaches for data/ is not in it, so CI goes red until someone
      # decides on purpose whether it belongs here.
      #
      # A NINTH exclusion, and it is not about data/: epl/tests/test_shots.py is
      # PLATFORM-bound, not archive-bound. Its autouse fixture calls
      # /usr/bin/xcrun to resolve the macOS SDK path, because the H' harness it
      # tests contains its workers with `sandbox-exec` and pins its runtime
      # closure to Homebrew paths — Darwin facilities, by design, named in the
      # preregistration. On ubuntu the fixture raises
      # NativeWorkerSandboxStop("required tool is unavailable: /usr/bin/xcrun")
      # at SETUP, so all 409 of its tests report as errors rather than as the
      # "this platform cannot run it" they are. The module and its harness are
      # FROZEN H' bytes and may not be edited to add a skip, so the exclusion is
      # stated here instead.
      #
      # Nothing is lost by excluding it, because this job was never where that
      # module's bar is enforced. Its release bar runs at freeze time on the
      # Darwin release host and its receipt is committed, not inferred:
      # reports/evidence/epl_shots/harness_manifest.json, schema
      # epl-shots-harness-manifest-4, carries canary_receipt.counts
      # {collected: 43, expected: 43, passed: 43, failed: 0, skipped: 0,
      # xfailed: 0, xpassed: 0} at python 3.12.13 with PYTHONPATH=src:. and
      # audit_receipt.pass true over five deliberate-failure canaries. 409 tests
      # collect on the release host; the 43 are the canary subset the receipt
      # binds. A change to those bytes changes the manifest, and the manifest is
      # what a reader checks.
      - name: Run the EPL suite (data-dependent modules named and excluded)
        env:
          PYTHONPATH: src:.
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          echo "Excluded — read data/epl/ archives at module or fixture scope:"
          echo "  test_baseline test_fit test_freeze test_improve"
          echo "  test_select test_sensitivity test_simcanary test_simcli"
          echo "Excluded — Darwin-only by design (sandbox-exec, /usr/bin/xcrun);"
          echo "  release bar enforced on the Darwin release host, receipt at"
          echo "  reports/evidence/epl_shots/harness_manifest.json (43/43):"
          echo "  test_shots"
          pytest epl/tests -q \
            --ignore=epl/tests/test_baseline.py \
            --ignore=epl/tests/test_fit.py \
            --ignore=epl/tests/test_freeze.py \
            --ignore=epl/tests/test_improve.py \
            --ignore=epl/tests/test_select.py \
            --ignore=epl/tests/test_sensitivity.py \
            --ignore=epl/tests/test_simcanary.py \
            --ignore=epl/tests/test_simcli.py \
            --ignore=epl/tests/test_shots.py
