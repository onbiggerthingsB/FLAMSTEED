name: Deploy site to GitHub Pages

# Publishes site/ (three self-contained HTML files, zero external requests,
# zero build step) to flamsteed.io. Only site/ is published — the repo also
# holds the model, the sealed lock chain and the forecast archive, none of
# which belong on the public web server.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'tools/site_check.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:        # lets you deploy by hand without a site/ change

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# cancelling it, so a half-published site is not a state we can reach.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One script now carries every promise this job used to make inline, so
      # the same gate runs here and on a laptop before the PR is opened:
      #   G1 the pages are self-contained — a reader loads a forecast without
      #      any third party learning they did;
      #   G2 no placeholder URL survives (a `mailto:TODO-…@example.com` reached
      #      the live site on 2026-08-11 because the old guard required http);
      #   G3 every in-repo citation resolves on this ref (a dead link under a
      #      "Committed report" label is worse than no citation at all);
      #   G4 the whole-file external scan the tag-level grep was blind to;
      #   plus do-not-ship strings, folio typography, display weight, CNAME,
      #   uptime sentinels, the ≤120 KB page budget, and SEALED lock versions.
      - name: Site gate (guards, claims, weight, marks)
        run: tools/site_check.sh site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
