seed: 20260611              # global RNG seed (tournament kickoff date as integer)
paths:
  raw: data/raw
  processed: data/processed
  cache: data/cache
  reports: reports
elo:
  initial_rating: 1500.0
  provisional_games: 5              # first N matches flagged provisional (low-info marker; debutants start at initial_rating, not a faked-low value — Phase-2 prior handles uncertainty)
  provisional_volatility_threshold: 16.5   # rating-pts; population std of the team's last `volatility_window` PRIOR rating deltas above this => ALSO provisional (low-info even with a long history) — Phase-2 prior must widen. EMPIRICALLY DERIVED (not test-fit): the p95 of this windowed-stddev metric across ALL teams over the whole martj42 history (49,296 played matches, 98,256 evaluable team-match states) — distribution is median≈10.2, p75≈12.5, p90≈14.9, p95≈16.5, p99≈19.4, max≈30. So 16.5 flags the most-volatile ~4.9% tail; the OLD 40 flagged 0.00% (decorative — the exact RIDER-1 failure mode). NB the windowed stddev saturates far below the single-update ceiling (~90 = K·G·|W−E| at WC) because a real 10-match window mixes low-K friendlies/qualifiers + near-1 G + small |W−E|. See ASSUMPTIONS.md + scripts/derive_volatility_threshold.py.
  volatility_window: 10             # # of most-recent PRIOR rating deltas used to measure recent_rating_volatility (causal std: strictly before the current match)
  home_advantage: 100.0             # rating points
  k_base: 40.0
  k_by_match_type:                  # importance multiplier on k_base
    wc_finals: 1.0
    continental_championship: 0.9
    wc_qualifier: 0.8
    continental_qualifier: 0.8
    nations_league: 0.7
    friendly: 0.4
    other: 0.5
  mov_index: world_football_elo     # goal-difference multiplier scheme (see Task 5)
baseline:
  draw_base: 0.28                    # naive-Elo 1X2 draw parameter d0 (pinned)
windows:
  feature_years: 4                   # feature/model window (time-decay)
  decay_half_life_days: 365          # exponential time-decay half-life
  # backtest window is NOT cropped here — see windows.py / Task 12
covid:
  start: "2020-03-01"
  end: "2021-06-30"
statsbomb:
  # Open Data is static + versioned and has no per-pull git tag exposed by the
  # client, so we pin the installed client version + the pull date as the
  # release marker (Task 9). Open Data is append-mostly (new competitions added
  # over time; existing covered-match data is stable), so for COVERED matches xG
  # is point-in-time "as close as release versioning allows":
  # valid_as_of == observed_at == match_date. xG is coverage-gated, NULL-safe,
  # and NEVER imputed (see ASSUMPTIONS.md / SOURCES.md).
  open_data_version: "statsbombpy-1.18.0@2026-06-03"
model:
  likelihood: dixon_coles            # dixon_coles | bivariate_poisson  (P4 DOF #8)
  neutral_home_adv_fraction: 0.5     # neutral game = mu + k*home_adv per side (split the home edge; 0.5 principled, ~0.53 empirical). P5-tunable.
  covariates:
    enabled: []                       # e.g. ["rest_days"] — empty = baseline, no covariate terms
    beta_scale: 0.25                  # Normal(0, beta_scale) prior on each standardized coefficient
    host_k: 1.4                       # EMPIRICAL (P2b, ADOPTED 2026-06-10): k_elo=1.422, 95% CI [1.18,1.64] over n=873 finals-tier host games — CI excludes the old 0.5 assumption. host advantage as a multiple of standard home_adv (1 = ordinary home). reports/host_k_2026-06-10.md
    hosts: ["United States", "Mexico", "Canada"]   # 2026 host nations (match tournament_2026.yaml names)
    missing_indicator_for: ["travel_km", "altitude_m", "accl_alt"]   # per-cov missingness indicator (Q1); accl_alt = P2a acclimatized-altitude (sparse city coverage)
  prior:
    sigma_att: 0.5                   # HalfNormal scale, attack hyperprior  (P4 DOF #6)
    sigma_def: 0.5                   # HalfNormal scale, defense hyperprior (P4 DOF #6)
    mu_loc: 0.0                      # baseline log goal-rate prior loc
    mu_scale: 1.0
    home_loc: 0.25                   # home-advantage log-multiplier prior loc
    home_scale: 0.25
    rho_scale: 0.1                   # DC tau / BP-correlation prior scale
  strength_prior:
    enabled: true            # CALIBRATED ON: anchoring beats the old model AND plain Elo on held-out 1X2 RPS
    source: elo              # elo only in v1 (market anchor out of scope)
    k_att: 0.6               # knee of the held-out-RPS curve: k=0 RPS 0.359 (worse than Elo 0.340); k>=0.6 plateau ~0.333 (beats Elo). 0.6 = full gain, least anchoring. See scripts/sweep_strength_k.py
    # ^ those three levels are PRE-F16 [0, 2]-scale (recorded 2026-06). Since the
    #   2026-07-28 canonical-RPS consolidation (OA finding 16) the sweep scores through
    #   wcmodel.model.calibration.rps and a re-run prints their HALVES, ~0.1795 / 0.170 /
    #   0.1665. That halving is the unit change, NOT an accuracy gain, and it leaves this
    #   k decision intact: a uniform /2 preserves sign, ordering and ratios.
    k_def: 0.6
  widening:
    mechanism: c                     # a (likelihood down-weight) | c (predictive-variance inflation)  (P4 DOF #3)
    strength: 0.5                    # widening strength, co-tuned with windows.decay_half_life_days  (P4 DOF #4)
  inference:
    backend: advi                    # advi | pathfinder | nuts
    draws: 1000
    tune: 1000
    advi_iters: 30000
sim:
  n_sims: 20000               # MC sims (config-driven; raise for the final pre-tournament run)
  max_goals: 12               # scoreline grid bound for DC sampling
  extra_time_scale: 0.3333    # ET goal-rate scale (~30/90 of regulation); P4-tunable
  penalty_home_prob: 0.5      # shootout coin-flip (no tilt); P4-tunable
backtest:
  # Walk-forward grid. `odds_start` is an EXPLICIT key (UNVERIFIED magnitude,
  # Phase-0): the headline The-Odds-API snapshot start is 2020-06-06, but usable
  # per-bookmaker pinnacle/betfair depth may begin later — set from verified
  # depth, never assumed (reports/phase1_odds_depth.md). The cutoff grid is the
  # set of as-of decision dates the sweep walks; production builds it from the
  # backtest_window match dates, this literal is the synthetic-harness default.
  odds_start: "2020-06-06"
  refit_cadence: matchday          # refit the posterior once per matchday (D5)
  primary_bookmaker: pinnacle      # CLV benchmark = Pinnacle close (margin-in-line)
  # Staking / trigger (D5).
  edge_threshold: 0.02             # bet only when |edge| > 2pp on de-vigged prob (TRIGGER, not a DOF)
  kelly_fraction: 0.25             # ¼-Kelly (lockbox DOF #9)
  commission:
    pinnacle: 0.0                  # margin already in the line — no separate commission
    betfair: 0.02                  # 2% on NET winnings, only if/when Betfair is used
  devig_method: shin               # de-vig of the close (lockbox DOF #7; Shin prior; chosen empirically by RPS)
  # Non-bet filters.
  max_spread: 0.05                 # wide-spread non-bet threshold — INERT on the h2h feed (no bid/ask); gated behind _WIDE_SPREAD_ENABLED for the funded Betfair back/lay path
  stale_snapshot_seconds: 86400    # entry snapshot older than this before kickoff => stale non-bet
  # Foresight-RED ceilings (the "too-good = bug" guardrail, ENFORCED as a test).
  # Any metric past RED => SUSPECTED LEAK => STOP and investigate, never celebrate.
  foresight_red:
    roi: 0.10                      # simulated ROI above +10% vs the sharp close on the big-match upper bound is implausible
    beat_close_rate: 0.58          # beating the sharp close > 58% of bets is implausibly good
    avg_clv: 0.02                  # average CLV% above +2% is implausibly good
  # Statistical validation (D4).
  lockbox_fraction: 0.18           # final 18% of odds-covered history BY DATE, frozen
  preregistered_config_count: 9    # the 9 DOF (ASSUMPTIONS deferred-ii); lockbox judged against THIS
  permutation_shuffles: 200        # label-shuffle null; model real score must sit ~99th pct
  permutation_pct: 0.99
  # Reproducibility.
  bootstrap_resamples: 2000        # bootstrap CI resamples for ROI/drawdown/etc.
  bootstrap_seed: 20260611         # seeded so CIs are bit-reproducible
odds:
  # Per-competition Odds API sport keys for the HISTORICAL routes (OA F13).
  # The generic `soccer` key the old adapter hardcoded is INVALID — the API
  # rejects it. These exact strings are VERIFIED by the OA-0a probe
  # (scripts/oa_probe.py); config-driven so the probe can correct a wrong key
  # WITHOUT a code change.
  sport_keys:
    wc2022: soccer_fifa_world_cup
    euro2024: soccer_uefa_european_championship
    wc2026: soccer_fifa_world_cup
oa_dev_slate:
  # THE FROZEN DEVELOPMENT-SLATE RULE (OA Plan 2 v2, V0 / Codex finding 9).
  # Verbatim, as corrected 2026-08-01 (see the dated note below):
  #
  #   "every completed senior men's international in the probed competitions
  #    with kickoff in [2022-01-01, 2025-12-31], excluding every fixture in
  #    the frozen scored inventory (exact scored-fixture membership by
  #    canonical fixture identity, config/oa_scored_inventory.yaml), ordered
  #    chronologically, truncated to the first N_dev with admissible coverage"
  #
  # 2026-08-01 PRE-LOCK RULE CORRECTION (Codex batch-1 finding 9, RATIFIED):
  # the original text excluded by the scored pools' CALENDAR WINDOWS, which
  # blanketed Copa America 2024 (entirely inside the euro2024 window) although
  # it shares not one fixture with the scored pools. Exclusion is now exact
  # membership in the committed scored inventory; the windows below are KEPT
  # for other consumers but no longer drive dev exclusion. Recorded before
  # the V8 lock, before any dev odds were bought.
  #
  # The split that makes it a freeze rather than a preference: the COMPETITION
  # KEYS are chosen by coverage EVIDENCE (the `--slate` mini-probe, then the
  # G-B acquisition); fixture SELECTION within them is this rule and nothing
  # else. No "and drop the thin ones", no re-ordering, no second window —
  # every such knob is researcher degrees of freedom on the very data w is
  # tuned on. The rule is implemented once in src/wcmodel/eval/dev_slate.py
  # (THE_RULE / DEV_WINDOW / SCORED_INVENTORY_PATH) and pinned literally by
  # tests/eval/test_dev_slate.py, so this comment and the code cannot drift.
  #
  # scripts/oa_dev_manifest.py applies it and emits `manifest_path`, which is
  # committed and hash-bound into the V8 prereg lock.
  window:
    start: "2022-01-01"
    end: "2025-12-31"
  # The frozen identity list of every odds-scored fixture — THE dev exclusion
  # set (generated by scripts/oa_scored_inventory.py, never hand-edited).
  scored_inventory: config/oa_scored_inventory.yaml
  # The scored pools' calendar windows: kept for consumers that need the
  # pools' spans/labels (reporting, the dev-ledger pool-name guard). NOT the
  # dev exclusion — that is exact membership in scored_inventory (2026-08-01
  # correction above).
  scored_pool_windows:
    wc2022: ["2022-11-20", "2022-12-18"]
    euro2024: ["2024-06-14", "2024-07-14"]
    wc2026: ["2026-06-11", "2026-07-19"]
  # EMPTY until the `--slate` mini-probe reports coverage: pre-seeding these
  # from a hunch is exactly the degrees of freedom the freeze exists to
  # remove. Values are martj42 `tournament` labels (the store's vocabulary),
  # not Odds-API sport keys.
  #
  # 2026-08-01 USER RULING at the G-B spend gate (cap 6,650): the four
  # competitions the slate probe verified covered WITH Pinnacle
  # (reports/oa_slate_probe.md — Copa América 2024, AFCON 2023/24 finals,
  # WCQ CONMEBOL 2025, and UEFA NL after the marquee-tier re-probe showed
  # Pinnacle on Netherlands v Spain T-1h; the Armenia absences were fixture
  # size, not competition policy).
  competitions:
    - Copa América
    - African Cup of Nations
    - UEFA Nations League
    - FIFA World Cup qualification
  # 2026-08-01 USER RULING: 300, frozen BEFORE any dev snapshot is bought.
  #
  # 2026-08-01 AMENDMENT (USER-RULED, post-G-B, pre-lock): 300 -> 260.
  # The G-B walk (reports/oa_acquire_gb_dev.md) exhausted ALL 632 eligible
  # candidates and covered 260; the cap never bound. 300 is not reachable
  # from the evidence-backed competition set — European WCQ returns zero
  # events even on a 2025 date (the best-covered era), and no other senior
  # men's international competition exists in the API's vocabulary.
  #
  # This amendment is OUTCOME-BLIND: coverage is a property of the odds
  # archive alone (was a Pinnacle quote posted before 08:30Z?), computed
  # without touching a single result. It is the same class of correction as
  # dropping Gold Cup from `competitions` — evidence about what can be
  # bought, never about what the fixtures did. THE_RULE itself is unchanged:
  # "the first N_dev with admissible coverage" simply binds at the supply
  # limit rather than at the target.
  #
  # Realized design: 260 fixtures over 16 months = 14 scoreable monthly
  # folds (227 fixtures) after V6's two-month ledger burn-in.
  n_dev: 259
  manifest_path: config/oa_dev_manifest.yaml
  # ACQUISITION-ONLY evidence scope (bounds SPEND, never selection): which
  # Odds-API key each competition's listings are bought on, exactly as the
  # probe verified them. `participants` restricts which candidate matchdays
  # buy a listing — the store label "FIFA World Cup qualification" spans
  # every confederation, but the probed key carries ONLY CONMEBOL, so
  # non-CONMEBOL WCQ candidates are never listed, never match, and fall out
  # of the slate as not-admissible under the unchanged frozen rule.
  acquisition:
    sport_keys:
      Copa América: soccer_conmebol_copa_america
      African Cup of Nations: soccer_africa_cup_of_nations
      UEFA Nations League: soccer_uefa_nations_league
      FIFA World Cup qualification: soccer_fifa_world_cup_qualifiers_south_america
    participants:
      FIFA World Cup qualification:
        - Argentina
        - Bolivia
        - Brazil
        - Chile
        - Colombia
        - Ecuador
        - Paraguay
        - Peru
        - Uruguay
        - Venezuela
live:
  # L1 SPEND GATE. dry_run=true => NO network, NO real odds spend, NO real bet:
  # the whole live pipeline runs against the fixture / the clearly-labelled-non-real
  # synthetic harness. Flipping to false is a SEPARATE explicit funding action
  # (after the Phase-0 four-point checklist + pricing-fits-budget) — the ONE gated
  # switch. Default true so a fresh run can never spend or imply a real bet.
  dry_run: true
  # L2 EXECUTION BOUNDARY. signal_only=true => the system emits SIGNALS + a PAPER
  # ledger only; it NEVER places a real bet (no broker/exchange/order path exists).
  # Any real bet is the user's manual action. There is no false setting wired —
  # this is a standing, asserted invariant.
  signal_only: true
  # Feed-agnostic (L1 rider b). The bookmaker we transact-price against and the
  # sharp CLV benchmark are configurable; the Pinnacle-via-aggregator vs Betfair-
  # Exchange pick is deferred to funding-time (Pinnacle closed its public API in
  # July 2025; at funding-time verify The Odds API still carries Pinnacle's close,
  # else use Betfair Exchange). The fixture carries BOTH keys.
  bookmaker: pinnacle              # the transacted-price book (entry/close)
  sharp_benchmark: pinnacle        # the sharp CLV benchmark close (== bookmaker until re-picked at funding)
  sport_key: soccer_fifa_world_cup # the Odds API sport key for the GET /v4/sports/{sport}/odds route
  regions: us,uk,eu                # Odds API regions param (us+uk+eu -> covers the soft books that post WC totals: betmgm/williamhill/betrivers/DK/FD/bet365)
  market: h2h                      # 1X2 head-to-head (PRIMARY surface)
  refresh:
    matchday: true                 # one refresh per matchday
    pre_kickoff_minutes: 60        # an extra refresh ~kickoff-1h for active fixtures
  call_budget:
    max_calls_per_day: 480         # hard ceiling on live fetches/day (pinned to plan quota)
    rate_limit_backoff_seconds: 2.0  # base backoff on a 429/5xx (exponential)
    max_retries: 4
  scan:
    min_liquidity: 0.0             # liquidity floor; markets below are coverage-gapped (0 = keep all in dry-run)
    progression_coverage_gated: true  # outright/progression surface is SECONDARY + coverage-gated (sub-threshold = gap)
  ledger_path: reports/live_paper_ledger.jsonl
markets:
  totals:
    lines: [0.5, 1.5, 2.5, 3.5, 4.5, 5.5]   # O/U goal lines derived from the scoreline grid
    edge_threshold: 0.03                      # min +EV (model_prob*odds - 1) AFTER uncertainty shrink to bet
    soft_books: ["betmgm", "williamhill", "betrivers", "draftkings", "fanduel", "bet365"]   # +EV is vs THESE; betmgm/williamhill/betrivers confirmed posting WC totals, others kept harmlessly
    sharp_book: "pinnacle"                    # sharp reference ONLY (never bet, never enters the model)
value:
  sports: ["soccer_fifa_world_cup"]   # config-driven; WC-only default, trivially extensible
  markets: ["h2h", "totals"]
  regions: us,uk,eu
  sharp_book: pinnacle                # the truth reference; absent => coverage gap
  edge_min: 0.02                      # report soft-beats-sharp edges >= 2%
  too_good: 0.10                      # > 10% => SUSPECTED ARTIFACT, excluded from bettable
  longshot_odds: 8.0                  # edges above this decimal price tagged fragile
  stale_seconds: 900                  # a line quote older than this is flagged stale
  kelly_fraction: 0.25                # ¼-Kelly suggested stake
  soft_books: [betmgm, draftkings, fanduel, betrivers, williamhill, bovada, betonlineag,
               mybookieag, betsson, leovegas, unibet_uk, unibet_eu, unibet_nl, unibet_se,
               nordicbet, casumo, coolbet, grosvenor, betvictor, gtbets]
  max_calls_per_scan: 2               # hard credit cap per scan
  ledger_path: reports/value_paper_ledger.jsonl
dashboard:
  dry_run: true               # synthetic-odds posture; the real-feed flip is gated (ASSUMPTIONS)
  output_dir: data/dashboard  # snapshot bundles land here (under the gitignored /data/)
  n_sims: 20000               # sim sample size for the snapshot (overridable per build)
