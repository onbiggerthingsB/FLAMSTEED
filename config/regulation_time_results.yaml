# 90-minute (regulation) results for knockout fixtures (OA finding 3).
#
# Bookmaker 1X2 settles at 90 minutes, so extra-time-inclusive final scores
# must never be scored against 1X2 prices. score_90 is the score at the END OF
# 90 MINUTES (stoppage time included; 90+n counts as inside 90'). went_et means
# the match continued into extra time, which is only possible from a 90' draw.
# Group-stage matches need no entry — there the store score IS the 90' score.
#
# Team names AND home/away orientation match the martj42 store
# (data/stores/full_final). Wikipedia's bracket sometimes lists the pair the
# other way round (e.g. the Euro-2024 QF as "Spain vs Germany"); those rows are
# flipped, score included, so the table joins to the store on (date,home,away).
# Curated from the Wikipedia match reports listed in each row's source field:
# every row's teams/date/final score were cross-checked against the store, and
# each 90' score was derived from the goal-minute annotations in that report.
# Counts: wc2022 16, euro2024 15, wc2026 32 = 63 rows. No fixture was omitted.
# Of those, 19 went to extra time (wc2022 5, euro2024 5, wc2026 9). Both counts
# are pinned in tests/eval/test_regulation.py: an ET-DECIDED match flipped to
# went_et false carries its ET-inclusive (non-level) score, which every other
# layer accepts — the store records only ET-inclusive finals, so the ET count is
# the one thing that notices. Adjust either pin ONLY alongside a curated row.


