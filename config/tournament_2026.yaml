# WC-2026 tournament structure — FOR HUMAN REVIEW (Phase-1 data layer).
#
# STATUS: NOT committed, NOT ingested, NOT validated into the store. This file
# is the verified-draw artifact that `wcmodel.data.tournament.load_tournament`
# consumes; it is being staged for review before anything downstream reads it.
#
# PROVENANCE
#   draw + fixtures + grounds : openfootball/worldcup.json @ master,
#                               2026/worldcup.json  (CC0). 104 matches verbatim:
#                               72 group-stage + 32 knockout.
#   team names                : martj42/international_results store keys
#                               (commit dad6874bb720e23cccdf696f057aa64fa5471445),
#                               so features.build can join each team's history.
#                               openfootball->martj42 mapping (46/48 identical;
#                               USA->United States, Bosnia & Herzegovina->Bosnia
#                               and Herzegovina) is in
#                               reports/phase1_wc2026_reconciliation.md.
#   venue coords              : openfootball 2026/worldcup.stadiums.json (CC0).
#   venue altitude_m          : Open-Meteo elevation API (Copernicus DEM) at the
#                               stadium coords (free, no key). Point-derived.
#   knockout slots            : openfootball R32->Final slot/winner linkage,
#                               cross-checked 1:1 against FIFA's published 2026
#                               bracket (Wikipedia render) — 0 mismatches.
#
# Group fixtures carry REAL drawn nations (martj42 keys). Knockout fixtures are
# STRUCTURE placeholders only (group-position slots like 1A / 3rd-ABCDF, and
# winner/loser refs like W74 / L101) — NEVER fabricated teams, since the
# knockout participants are not yet known.
#
# Fixture fields: home, away, date (required by validator) + time, group, round,
# venue (enrichment). Times are local with a UTC offset, as published by
# openfootball. `match` on knockout rows is the official match number (73-104).

