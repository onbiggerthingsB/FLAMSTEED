# AFC Asian Cup 2027 tournament structure — REAL DRAW (Phase-2A Task 6).
#
# PROVENANCE
#   groups (draw)     : AFC Final Draw, 2026-05-09, At-Turaif/Salwa Palace, Riyadh
#                       (the-afc.com "AFC Asian Cup Saudi Arabia 2027 - The Groups";
#                       cross-checked vs khelnow.com final-draw report, 2026-05-10).
#                       The E4 slot (Lebanon/Yemen) resolved to Yemen via the
#                       2026-06-04 playoff in Doha (Yemen 2-0 Lebanon).
#   fixtures + venues : official AFC Match Schedule (issue 5 June 2026), archived at
#                       docs/superpowers/research/AC27F_MatchSchedule_5june26.pdf
#                       (assets.the-afc.com/2027_AFC_Asian_Cup/Downloads/Match_Schedule/
#                       AC27F_MatchSchedule_5june26.pdf). 51 matches: 36 group (numbers
#                       1-36, kept as comments — group rows carry no `match` key by the
#                       format contract) + 15 knockout (`match:` 37-51). No kickoff
#                       times: the wall chart publishes dates only; nothing is invented.
#   knockout wiring   : identical to regs Arts. 9.8-9.12 (R16 pairings, QF/SF/Final
#                       linkage) under the schedule's numbering — verified 1:1 in
#                       config/afc2027_rules_extract.md. Third slots 38/39/40/44 match
#                       config/third_place_assignment_ac2027.json (renumbered to the
#                       schedule; scripts/verify_thirds_table.py PASS).
#   team names        : martj42 store keys (P1-WC2026 reconciliation process), so
#                       features.build joins each team's history. 19/24 identical to
#                       the AFC official names; 5 mapped:
#                         DPR Korea                -> North Korea
#                         Islamic Republic of Iran -> Iran
#                         Kyrgyz Republic          -> Kyrgyzstan
#                         China PR                 -> China
#                         Korea Republic           -> South Korea
#   venues            : the schedule's 8 stadiums (capacity from the chart). `city`
#                       labels are stadium-qualified (WC-2026 multi-stadium-city
#                       convention) and are the keys fixtures reference via `venue`;
#                       all venues carry country SA (host detection + neutral flags).
#
# Group fixtures carry REAL drawn nations (martj42 keys). Knockout fixtures are
# STRUCTURE placeholders only (1A/2B seeds, 3rd-XXX best-third slots, W{n}
# winner refs) — the participants are not yet known.

